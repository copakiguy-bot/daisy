<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1efe8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="데이지">
<link rel="apple-touch-icon" href="icon.png">
<title>데이지</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23fff' stroke='%23333' stroke-width='2'%3E%3Cellipse cx='50' cy='24' rx='9' ry='20'/%3E%3Cellipse cx='50' cy='76' rx='9' ry='20'/%3E%3Cellipse cx='24' cy='50' rx='20' ry='9'/%3E%3Cellipse cx='76' cy='50' rx='20' ry='9'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='12' fill='%23f5a623' stroke='%23333' stroke-width='2'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--dark:#12312b;--text:#2b3a36;--muted:#8a9490;--line:#e9e6df;--cream:#faf8f2;--green:#2f6f5e;--yellow:#f4b740;--red:#e34948;--card:#fff;--bg:#f1efe8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;-webkit-tap-highlight-color:transparent}
  /* 가운데 데이지 */
  .stage{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .flower{width:132px;height:132px;cursor:pointer;border:none;background:none;padding:0;transition:transform .25s ease}
  .flower:hover{transform:rotate(-8deg) scale(1.04)}
  .flower:active{transform:scale(.96)}
  .flower svg{width:100%;height:100%;display:block}
  .msg{font-size:13px;color:var(--muted);min-height:18px}
  /* 책 목록: HMD 맨 위 일정처럼 손잡이를 누르면 스르륵 열린다 */
  .shelf{display:flex;flex-direction:column;align-items:center;width:min(340px,86vw)}
  .sh-handle{border:none;background:none;padding:10px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;font-family:inherit}
  .sh-bar{display:block;width:120px;height:4px;border-radius:4px;background:#d9d5cc;transition:background .13s,width .25s,transform .13s}
  .sh-handle:hover .sh-bar{background:#bfc7c2;transform:scaleY(1.5)}
  .shelf.open .sh-bar{width:190px;background:var(--line)}
  .sh-cur{font-family:'Gowun Dodum',sans-serif;font-size:13.5px;color:var(--muted);min-height:18px;transition:opacity .25s}
  .shelf.open .sh-cur{opacity:0}
  .sh-clip{overflow:hidden;max-height:0;opacity:0;width:100%;transition:max-height .42s cubic-bezier(.4,0,.2,1),opacity .3s ease}
  .shelf.open .sh-clip{opacity:1}
  .sh-list{list-style:none;margin:0;padding:4px 0 8px;display:flex;flex-direction:column;gap:2px;max-height:min(46vh,420px);overflow:auto;transform:translateY(-10px);transition:transform .42s cubic-bezier(.4,0,.2,1)}
  .shelf.open .sh-list{transform:none}
  .sh-it{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;border-radius:11px;padding:7px 10px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text)}
  .sh-it:hover{background:rgba(255,255,255,.6)}
  .sh-it.on{background:#fff;box-shadow:0 2px 10px rgba(18,49,43,.06)}
  .sh-cv{flex:none;width:26px;height:38px;border-radius:2px;object-fit:cover;background:#e6e2d8;box-shadow:0 1px 4px rgba(0,0,0,.14)}
  .sh-all{display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:none;background:none}
  .sh-t{flex:1;min-width:0}
  .sh-t b{display:block;font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:15px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-t span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sh-n{flex:none;font-size:12px;color:var(--muted)}
  .sh-it.on .sh-n{color:var(--green);font-weight:700}
  /* 날아오는 꽃 · 떨어지는 꽃잎 */
  .daisy-dim{position:fixed;inset:0;background:rgba(18,49,43,.34);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:118}
  .daisy-fly{position:fixed;z-index:119;pointer-events:none;line-height:0;filter:drop-shadow(0 8px 22px rgba(18,49,43,.12));will-change:transform}
  .daisy-fly svg{display:block;width:100%;height:100%}
  .daisy-fp{position:fixed;z-index:121;width:14px;height:34px;background:#f7f5f0;border:none;border-radius:55% 55% 50% 50% / 65% 65% 42% 42%;pointer-events:none;box-shadow:0 2px 10px rgba(18,49,43,.08);animation:daisyfall 1.25s cubic-bezier(.4,.15,.7,1) forwards}
  @keyframes daisyfall{0%{opacity:1;transform:translate(0,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx,20px),230px) rotate(var(--rot,200deg))}}
  /* 발췌 카드 */
  .ex-ov{position:fixed;inset:0;background:rgba(18,49,43,.55);display:flex;align-items:center;justify-content:center;z-index:120;padding:20px;animation:ovIn 1.1s ease both}
  @keyframes ovIn{from{background:rgba(18,49,43,.34)}to{background:rgba(18,49,43,.55)}}
  @keyframes boxIn{0%{opacity:0;transform:translateY(12px) scale(.985)}100%{opacity:1;transform:none}}
  @keyframes txtIn{0%{opacity:0;filter:blur(3px)}100%{opacity:1;filter:blur(0)}}
  .ex-body>.ex-cvw{animation:txtIn 1.2s .2s ease-out both}
  .ex-body>.ex-quote{animation:txtIn 1.5s .45s ease-out both}
  .ex-body>.ex-src,.ex-body>.ex-bib{animation:txtIn 1.2s .95s ease-out both}
  .ex-body>.cm-tg-row,.ex-box>.ex-next{animation:txtIn 1s 1.2s ease-out both}
  /* 카드 안에서 다음 문장으로 바뀔 때: 더 빠르게 차례로 */
  .ex-body.swap>.ex-cvw{animation:txtIn .9s 0s ease-out both}
  .ex-body.swap>.ex-quote{animation:txtIn 1.1s .12s ease-out both}
  .ex-body.swap>.ex-bib{animation:txtIn .9s .45s ease-out both}
  .ex-body.swap>.cm-tg-row{animation:txtIn .8s .6s ease-out both}
  .ex-body.slid>*{animation:none}
  .ex-box{touch-action:pan-y}
  .fly-petal{position:fixed;z-index:125;pointer-events:none;will-change:transform,opacity;line-height:0}
  .fly-petal svg{width:100%;height:100%;display:block;overflow:visible}
  /* 책 표지를 누르면: 그 책의 문장들이 떠다닌다 */
  .fl-ov{position:fixed;inset:0;z-index:130;background:rgba(14,40,35,.985);overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation;-webkit-user-select:none;user-select:none;animation:flIn .7s ease both}
  @keyframes flIn{from{background:rgba(14,40,35,0)}to{background:rgba(14,40,35,.985)}}
  .fl-stage{position:relative;width:100%;min-height:100%}
  /* 떠다니는 어절 */
  .fl-w{position:absolute;left:0;top:0;font-family:'Gowun Dodum',sans-serif;line-height:1.2;color:#fbf8ef;cursor:pointer;white-space:nowrap;will-change:transform;transition:color .3s,text-shadow .3s,opacity .3s;padding:2px 3px}
  .fl-ov.hl .fl-w{opacity:.14!important}
  .fl-ov.hl .fl-w.on{opacity:1!important;color:#fff;text-shadow:0 0 12px rgba(244,183,64,.5)}
  /* 질서를 갖춘 문장들: 아이폰 세로 너비 · 왼쪽 정렬 · 줄바꿈 무시 */
  .fl-col{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:min(342px,calc(100vw - 48px))}
  .fl-sent{cursor:pointer;border-radius:10px;margin-left:-10px!important;margin-right:-10px!important;padding:4px 10px;transition:background .3s}
  @media (hover:hover){.fl-sent:hover{background:rgba(251,248,239,.05)}}
  .fl-sent.sel{background:rgba(244,183,64,.1)}
  /* 왼쪽: 이 책의 목차 · 모인 문장을 누르면 그 목차가 빛난다 */
  .fl-toc{position:fixed;left:18px;top:56px;bottom:18px;width:244px;z-index:3;overflow-y:auto;overscroll-behavior:contain;padding:6px 6px 20px 2px;font-family:'Gowun Dodum',sans-serif;color:rgba(251,248,239,.62);scrollbar-width:thin;scrollbar-color:rgba(251,248,239,.18) transparent;animation:flTocIn .9s .3s ease both}
  @keyframes flTocIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .fl-toc-h{font-family:'Noto Sans KR',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:rgba(251,248,239,.4);margin:0 0 8px 10px;min-height:16px}
  .fl-toc-h em{font-style:normal;font-weight:400;letter-spacing:0;color:rgba(244,183,64,.85);margin-left:6px}
  .fl-toc ol{list-style:none;margin:0;padding:0}
  .fl-toc li{position:relative;padding:4px 8px 4px 10px;border-radius:7px;line-height:1.45;font-size:13px;transition:background .5s,color .5s;cursor:pointer}
  @media (hover:hover){.fl-toc li:hover{background:rgba(251,248,239,.06);color:rgba(251,248,239,.95)}}
  .fl-toc li.lv1{font-size:13.5px;color:rgba(251,248,239,.82);margin-top:8px}
  .fl-toc li.lv1:first-child{margin-top:0}
  .fl-toc li.lv2{padding-left:22px}
  .fl-toc li.lv3{padding-left:36px;font-size:12.5px;color:rgba(251,248,239,.5)}
  .fl-toc li.has::after{content:'';position:absolute;left:3px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:rgba(244,183,64,.55)}
  .fl-toc li.lv2.has::after{left:15px}.fl-toc li.lv3.has::after{left:29px}
  .fl-toc li.anc{color:rgba(251,248,239,.95)}
  .fl-toc li.hit{background:rgba(244,183,64,.2);color:#fff;box-shadow:inset 3px 0 0 #f4b740;animation:flHit 1.6s ease}
  @keyframes flHit{0%{background:rgba(244,183,64,.55)}100%{background:rgba(244,183,64,.2)}}
  .fl-toc-tg{display:none;position:fixed;top:10px;left:12px;z-index:5;border:1px solid rgba(251,248,239,.25);background:rgba(14,40,35,.6);color:rgba(251,248,239,.85);font-family:'Gowun Dodum',sans-serif;font-size:13px;border-radius:999px;padding:5px 12px;cursor:pointer}
  @media (max-width:899px){
    .fl-toc{left:0;top:0;bottom:0;width:min(270px,80vw);padding:58px 10px 24px 8px;background:#0c241f;box-shadow:8px 0 30px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .4s cubic-bezier(.3,.7,.3,1);animation:none}
    .fl-toc.open{transform:none}
    .fl-toc-tg{display:block}
  }
  .fl-sent{margin:0 0 30px}
  .fl-sent p{margin:0;font-family:'Gowun Dodum',sans-serif;font-size:16px;line-height:1.85;color:#fbf8ef;text-align:left;word-break:keep-all;overflow-wrap:break-word}
  .fl-sent .fw.pending{visibility:hidden}
  .fl-src{margin-top:6px;font-size:12px;color:rgba(251,248,239,.5);transition:opacity .8s}
  .fl-src.pending{opacity:0}
  .fl-head{position:fixed;top:0;left:0;right:0;z-index:2;padding:16px 50px 22px;text-align:center;font-family:'Gowun Dodum',sans-serif;font-size:14px;color:rgba(251,248,239,.62);pointer-events:none;background:linear-gradient(rgba(14,40,35,.97) 55%,rgba(14,40,35,0))}
  .fl-x{position:fixed;top:10px;right:14px;z-index:4;border:none;background:none;color:rgba(251,248,239,.75);font-size:22px;cursor:pointer;padding:6px 8px;line-height:1}
  .fl-x:hover{color:#fff}
  .fl-hint{position:fixed;bottom:22px;left:0;right:0;z-index:2;text-align:center;font-size:12.5px;color:rgba(251,248,239,.55);pointer-events:none;animation:flHint 5s ease both}
  @keyframes flHint{0%,10%{opacity:0}20%,70%{opacity:1}100%{opacity:0}}
  .ex-box{background:var(--card);border-radius:22px;padding:46px 42px 34px;max-width:640px;width:100%;max-height:calc(100vh - 40px);overflow:auto;text-align:center;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:boxIn 1.1s cubic-bezier(.22,.8,.3,1) both}
  @keyframes expop{0%{opacity:0;transform:scale(.8) translateY(8px)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
  .ex-close{position:absolute;top:14px;right:20px;cursor:pointer;font-size:20px;color:var(--muted);line-height:1;background:none;border:none;padding:4px}
  .ex-close:hover{color:var(--dark)}
  .ex-quote{font-size:clamp(16px,2.4vw,20px);line-height:1.85;color:var(--dark);font-family:'Gowun Dodum',sans-serif;word-break:keep-all;white-space:pre-line}
  .ex-src{margin-top:18px;font-size:14px;color:var(--muted)}
  /* 문장 밑: 책 표지 → 서지정보 */
  .ex-cvw{display:flex;justify-content:center;margin:0 0 26px}
  .ex-cover{display:block;height:132px;width:auto;max-width:100px;object-fit:cover;border-radius:3px;box-shadow:0 6px 18px rgba(18,49,43,.16),0 1px 3px rgba(0,0,0,.1);background:#eeebe3;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
  @media (hover:hover){.ex-cover:hover{transform:translateY(-2px) rotate(-1.5deg);box-shadow:0 10px 24px rgba(18,49,43,.2),0 1px 3px rgba(0,0,0,.1)}}
  .ex-cover:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
  .ex-bib{margin-top:22px;line-height:1.6}
  .ex-bt{font-family:'Gowun Dodum',sans-serif;font-size:15px;color:var(--dark)}
  .ex-bm{font-size:12.5px;color:var(--muted);word-break:keep-all}
  .ex-next{display:block;margin:20px auto 0;border:none;background:none;padding:4px;cursor:pointer;width:76px;height:76px;transition:transform .25s ease;opacity:.92}
  .ex-next svg{width:100%;height:100%;display:block}
  .ex-next:hover{transform:rotate(-12deg) scale(1.06);opacity:1}
  .ex-next:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;border-radius:10px}
  .cm{text-align:left;overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);transition:max-height .55s cubic-bezier(.25,.8,.3,1),opacity .45s ease,transform .55s cubic-bezier(.25,.8,.3,1)}
  .cm.open{opacity:1;transform:none}
  .cm-in{margin-top:12px;padding-top:16px;border-top:1px solid var(--line)}
  .cm-tg-row{margin-top:20px;display:flex;justify-content:flex-end}
  .cm-tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px 5px 11px;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;min-width:52px;justify-content:center}
  .cm-tg svg{width:15px;height:15px;flex:none}
  .cm-tg:hover,.cm-tg.on{border-color:var(--yellow);color:var(--dark);background:#fffbea}
  .cm-tg .n{font-variant-numeric:tabular-nums}
  .cm-h{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:10px}
  .cm-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
  .cm-list:empty{display:none}
  .cm-it{background:var(--cream);border-radius:12px;padding:10px 13px}
  .cm-m{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:3px}
  .cm-m b{color:var(--green);font-size:12.5px}
  .cm-b{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-line;word-break:break-word}
  .cm-empty{font-size:13px;color:var(--muted)}
  .cm-form textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:'Gowun Dodum',sans-serif;font-size:15px;line-height:1.6;color:var(--text);background:#fff}
  .cm-form textarea:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 2px rgba(244,183,64,.18)}
  .cm-row{display:flex;align-items:center;gap:10px;margin-top:8px}
  /* 이름: 밑줄만 있는 작은 칸 (안 써도 됨 · 비우면 «익명») */
  .cm-name{flex:none;width:104px;min-width:0;border:none;border-bottom:1px dashed #ddd8cc;border-radius:0;padding:4px 2px;font-family:'Gowun Dodum',sans-serif;font-size:13px;color:var(--text);background:transparent}
  .cm-name::placeholder{color:#bdb8ad}
  .cm-name:focus{outline:none;border-bottom:1px solid var(--yellow)}
  .cm-send{flex:none;margin-left:auto;border:none;border-radius:9px;padding:7px 16px;background:var(--yellow);color:#3a2a00;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .cm-send:disabled{opacity:.5;cursor:default}
  .cm-st{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
  @media (max-width:520px){.ex-box{padding:40px 22px 28px;border-radius:18px}.ex-cover{height:112px}.ex-cvw{margin-bottom:22px}.ex-bib{margin-top:18px}}
  @media (prefers-reduced-motion:reduce){.ex-ov,.ex-box,.ex-box>*{animation:none!important}.daisy-fp{display:none}.cm{transition:none!important}}
</style>
</head>
<body>
<main class="stage">
  <button class="flower" id="flowerBtn" type="button" aria-label="데이지 누르기 · 문장 하나 꺼내기" title="눌러서 문장 하나 꺼내기"><svg id="headFlower" viewBox="0 0 100 100" aria-hidden="true"></svg></button>
  <div class="shelf" id="shelf">
    <button type="button" class="sh-handle" id="shHandle" onclick="shelfToggle()" aria-expanded="false" aria-controls="shClip" title="책 고르기"><span class="sh-bar"></span><span class="sh-cur" id="shCur"></span></button>
    <div class="sh-clip" id="shClip" inert><ul class="sh-list" id="shList"></ul></div>
  </div>
  <div class="msg" id="msg"></div>
</main>

<script>
/* ===== 데이지: 꽃을 누르면 꽃잎이 하나 지고, 발췌문 하나가 뜬다 =====
   발췌문은 같은 폴더의 excerpts.json 에서 읽는다 (관리: admin.html) */
/* 의견 저장소 (Supabase · HMD 와 같은 프로젝트의 daisy_comments 표) */
var SUPA_URL='https://qjedpvzqpheggfyupkof.supabase.co', SUPA_KEY='sb_publishable_XzarJNgIdymB3HShYoPvnA_qe_ige_l';
function sbH(extra){return Object.assign({apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},extra||{});}
var ITEMS=[], LOADED=false, LOAD_ERR='', CUR=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}

/* excerpts.json = { books:[{id,title,author,publisher,year,cover,isbn}], items:[{id,text,bookId,page}] }
   (예전 형식: 문장마다 book·author 를 직접 적은 것도 그대로 읽는다) */
var BOOKS=[], BOOK_BY={}, SCOPE=store('dz_scope')||'all';
function loadExcerpts(){
  return fetch('excerpts.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(j){
    var list=Array.isArray(j)?j:(j&&j.items)||[];
    BOOKS=((j&&j.books)||[]).filter(function(b){return b&&b.id!=null;}).map(function(b){var o=Object.assign({},b);o.id=String(b.id);return o;});
    BOOK_BY={};BOOKS.forEach(function(b){BOOK_BY[b.id]=b;});
    ITEMS=list.filter(function(x){return x&&String(x.text||'').trim();}).map(function(x,i){
      var o=Object.assign({},x);o.id=String(x.id!=null?x.id:i);
      if(o.bookId!=null&&BOOK_BY[String(o.bookId)])o.bookId=String(o.bookId);
      else if(o.book||o.author){                                   /* 예전 형식 → 제목으로 책을 묶는다 */
        var k='L:'+(o.book||'')+'|'+(o.author||'');
        if(!BOOK_BY[k]){BOOK_BY[k]={id:k,title:o.book||'',author:o.author||''};BOOKS.push(BOOK_BY[k]);}
        o.bookId=k;
      }else o.bookId='';
      return o;
    });
    BOOKS=BOOKS.filter(function(b){return ITEMS.some(function(x){return x.bookId===b.id;});});   /* 문장이 있는 책만 목록에 */
    if(SCOPE!=='all'&&!BOOK_BY[SCOPE])SCOPE='all';
    LOADED=true;LOAD_ERR='';msg('');
    shelfRender();syncPetals();buildDaisy(document.getElementById('headFlower'),false);
  }).catch(function(e){LOADED=true;LOAD_ERR='문장을 불러오지 못했습니다 ('+e.message+')';msg(LOAD_ERR);shelfRender();});
}
function msg(t){var m=document.getElementById('msg');if(m)m.textContent=t||'';}
function bookOf(it){return it&&it.bookId?BOOK_BY[it.bookId]||null:null;}
function scopeItems(){return SCOPE==='all'?ITEMS:ITEMS.filter(function(x){return x.bookId===SCOPE;});}

/* ---------- 책 목록 (손잡이를 누르면 열림) ---------- */

function shelfPick(id){

/* ---------- 고르기: 고른 범위(전체 / 책 하나)의 문장을 한 바퀴 다 볼 때까지 겹치지 않게 ----------
   꽃잎 8장 = 그 범위의 문장 전체. 본 문장 수 ÷ 전체 × 8 만큼 꽃잎이 진다
   (예: 문장 100개 → 12.5개마다 한 장 · 다 보면 꽃잎이 모두 지고, 다음에 누르면 새 꽃) */
function seenKey(){return 'dz_seen_'+SCOPE;}
function scopeState(){
  var ids=scopeItems().map(function(x){return x.id;});
  var seen=(store(seenKey())||[]).filter(function(id){return ids.indexOf(id)>=0;});
  return {ids:ids,seen:seen};
}
function petalsFor(seenN,total){return total?Math.min(DAISY_N,Math.floor(seenN*DAISY_N/total+1e-9)):0;}
function syncPetals(){var s=scopeState();daisyDropped=daisyOrder.slice(0,petalsFor(s.seen.length,s.ids.length));}
function pickItem(){
  var s=scopeState();if(!s.ids.length)return null;
  var fresh=s.seen.length>=s.ids.length;if(fresh)s.seen=[];
  var pool=s.ids.filter(function(id){return s.seen.indexOf(id)<0;});
  var last=store('dz_last');
  if(pool.length>1)pool=pool.filter(function(id){return id!==last;});
  var id=pool[Math.floor(Math.random()*pool.length)];
  s.seen.push(id);store(seenKey(),s.seen);store('dz_last',id);
  var it=ITEMS.find(function(x){return x.id===id;});
  return {it:it,fresh:fresh,drop:petalsFor(s.seen.length,s.ids.length)};
}

/* ---------- 데이지 그림 (HMD 와 같은 꽃) ---------- */
var DAISY_N=8, daisyAnimating=false;
var daisyDropped=[];
var daisyStart=Math.round(60/(360/DAISY_N))%DAISY_N;            // 2시 위치부터
var daisyOrder=[];for(var _k=0;_k<DAISY_N;_k++)daisyOrder.push(((daisyStart-_k)%DAISY_N+DAISY_N)%DAISY_N);
function buildDaisy(svg,soft){
  var s='',i,a;
  if(!soft){
    for(i=0;i<DAISY_N;i++){
      a=i*(360/DAISY_N);
      s+='<g data-i="'+i+'"'+(daisyDropped.indexOf(i)>=0?' style="opacity:0"':'')+' transform="rotate('+a+' 50 50)">'
        +'<path d="M50 51 C43.5 45 41.5 26 46 14 C47.4 9.6 52.6 9.6 54 14 C58.5 26 56.5 45 50 51 Z" fill="#ffffff" stroke="#333333" stroke-width="1.1" stroke-linejoin="round"/></g>';
    }
    s+='<circle cx="50" cy="50" r="12" fill="#f5a623" stroke="#333333" stroke-width="1.1"/>';
  }else{
    var shapes=['M50 52 C44 47 39.5 31 43 16 C45.2 8.2 54.8 8.2 57 16 C60.5 31 56 47 50 52 Z',
      'M50 52 C43.5 46.5 39 30 43.8 15.5 C46 7.8 55 8.2 56.5 15.8 C60 30.5 55.5 46.5 50 52 Z',
      'M50 52 C44.5 47.5 40 31.5 42.5 15.5 C44.8 7.8 55.5 7.6 57.5 16 C60.8 31 55.8 46.8 50 52 Z'];
    var tones=['#f6f5f3','#f4f3f0','#f7f6f4','#f3f2ef'];
    for(i=0;i<DAISY_N;i++){
      a=i*(360/DAISY_N)+(((i*137)%9)-4);var sc=1+((((i*89)%5)-2)*0.015),tr=(50*(1-sc)/sc).toFixed(2);
      s+='<g data-i="'+i+'"'+(daisyDropped.indexOf(i)>=0?' style="opacity:0"':'')
        +' transform="rotate('+a+' 50 50) scale('+sc+') translate('+tr+' '+tr+')">'
        +'<path d="'+shapes[i%3]+'" fill="'+tones[i%4]+'"/>'
        +'<ellipse cx="50" cy="43" rx="4" ry="5" fill="#f4e4dd" opacity="0.22"/></g>';
    }
    s+='<path d="M50 39.6 C55.5 39.4 60.4 43.6 60.5 49.4 C60.7 55.4 56.1 60.2 50.3 60.4 C44.3 60.6 39.6 55.9 39.5 50 C39.4 44 44.5 39.9 50 39.6 Z" fill="#e8812e"/>';
  }
  svg.innerHTML=s;
}
function daisySpawnFall(x,y,k,n,size){
  var fp=document.createElement('div');fp.className='daisy-fp';
  if(n>1){var a=(k/n)*Math.PI*2+Math.random()*.5,r=(size||200)*.24;x+=Math.cos(a)*r;y+=Math.sin(a)*r;fp.style.animationDelay=(k*70)+'ms';}
  fp.style.left=(x-7)+'px';fp.style.top=(y-17)+'px';
  fp.style.setProperty('--dx',(Math.random()*100-50).toFixed(0)+'px');
  fp.style.setProperty('--rot',((Math.random()*180+140)*(Math.random()<.5?-1:1)).toFixed(0)+'deg');
  document.body.appendChild(fp);setTimeout(function(){fp.remove();},1350+(k||0)*70);
}

/* ---------- 누르기: 꽃이 날아올라 꽃잎 하나 지고 → 문장 ---------- */
function daisyClick(){
  if(daisyAnimating)return;
  if(!LOADED){msg('불러오는 중…');return;}
  if(!ITEMS.length){msg(LOAD_ERR||'아직 등록된 문장이 없습니다.');return;}
  if(!scopeItems().length){SCOPE='all';store('dz_scope',SCOPE);shelfRender();}
  daisyAnimating=true;
  closeExcerpt();shelfToggle(false);
  syncPetals();
  var pk=pickItem();if(!pk){daisyAnimating=false;return;}
  if(pk.fresh)daisyDropped=[];                                   /* 한 바퀴 다 봤으면 새 꽃으로 */
  var fall=Math.max(0,pk.drop-daisyDropped.length);
  var head=document.getElementById('headFlower');
  buildDaisy(head,false);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    daisyDropped=daisyOrder.slice(0,pk.drop);buildDaisy(head,false);
    showExcerpt(pk.it);daisyAnimating=false;return;
  }
  var dim=document.createElement('div');dim.className='daisy-dim';document.body.appendChild(dim);
  var fly=document.createElement('div');fly.className='daisy-fly';
  fly.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"></svg>';
  document.body.appendChild(fly);
  var flySvg=fly.querySelector('svg');buildDaisy(flySvg,true);
  var r=head.getBoundingClientRect();
  var sx=r.left+r.width/2, sy=r.top+r.height/2, sSize=Math.max(r.width,20);
  var ex=window.innerWidth/2, ey=window.innerHeight/2-40, eSize=Math.min(250,window.innerWidth*0.6);
  var arcLift=Math.min(180,Math.abs(ex-sx)*.25+70);
  var t0=performance.now(), DUR=1500, dropMid=false;
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  function frame(now){
    var t=Math.min(1,(now-t0)/DUR), e=ease(t);
    var x=sx+(ex-sx)*e, y=sy+(ey-sy)*e, size=sSize+(eSize-sSize)*e;
    y+=Math.sin(Math.PI*e)*arcLift;
    x+=Math.sin(e*Math.PI*3)*(1-e)*26;
    y+=Math.sin(e*Math.PI*5)*(1-e)*7;
    var wob=Math.sin(e*Math.PI*4)*(1-e)*14;
    fly.style.width=size+'px';fly.style.height=size+'px';
    fly.style.left=(x-size/2)+'px';fly.style.top=(y-size/2)+'px';
    fly.style.transform='rotate('+(e*540+wob)+'deg)';
    if(!dropMid&&t>=0.55){
      dropMid=true;
      if(fall>0){                                                  /* 비율이 넘어갈 때만 꽃잎이 진다 (여러 장일 수도) */
        daisyDropped=daisyOrder.slice(0,pk.drop);
        buildDaisy(head,false);buildDaisy(flySvg,true);
        for(var k=0;k<fall;k++)daisySpawnFall(x,y,k,fall,size);
      }
    }
    if(t<1)requestAnimationFrame(frame);else linger();
  }
  function linger(){
    var l0=performance.now(), LDUR=1300, FADE=700, shown=false;
    function lf(now){
      var lt=Math.min(1,(now-l0)/LDUR);
      var breathe=1+Math.sin(lt*Math.PI*2)*0.018, bob=Math.sin(lt*Math.PI*2)*3.5, sway=Math.sin(lt*Math.PI*2+1)*2.5;
      var size=eSize*breathe;
      fly.style.width=size+'px';fly.style.height=size+'px';
      fly.style.left=(ex-size/2)+'px';fly.style.top=(ey-size/2+bob)+'px';
      fly.style.transform='rotate('+(540+sway)+'deg)';
      var fs=(LDUR-FADE)/LDUR;
      fly.style.opacity=lt<fs?'1':String(Math.max(0,1-(lt-fs)/(1-fs)));
      if(!shown&&lt>=fs){shown=true;dim.remove();showExcerpt(pk.it);}   /* 꽃이 사라지기 시작할 때 문장이 그 자리에서 천천히 떠오른다 */
      if(lt<1)requestAnimationFrame(lf);
      else{fly.remove();daisyAnimating=false;}
    }
    requestAnimationFrame(lf);
  }
  requestAnimationFrame(frame);
}

/* ---------- 발췌 카드 ---------- */
var exTimer=null;
/* 문장 위: 책 표지 / 문장 아래: 서지정보 (책제목 · 저자 · 출판사(출판년도) · p.쪽) */

function showExcerpt(it){

/* 카드 안의 내용만 새 문장으로 바꾼다 (상자 높이는 부드럽게 맞춘다) */
function swapBody(it,opt){
  opt=opt||{};
  var box=document.querySelector('#exOv .ex-box'),body=document.getElementById('exBody');if(!box||!body)return;
  var h0=box.offsetHeight;
  body.getAnimations().forEach(function(a){a.cancel();});

function reduceMotion(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}

/* ---------- 카드 밑 데이지: 빙그르르 돌며 꽃잎 하나가 떨어져 → 문장 쪽으로 커지며 사라지고 → 그 자리에 다음 문장 ---------- */
var exBusy=false;
/* ---------- 넘겨 보기: 카드를 왼쪽으로 밀면 다음 문장, 오른쪽으로 밀면 앞 문장 (키보드 ← → 도) ----------
   이 카드에서 본 문장들을 차례로 기억해 두고, 맨 끝에서 더 넘기면 새 문장을 꺼낸다 */
var HIST=[],HPOS=-1;
function exPickNew(){
  if(!scopeItems().length){SCOPE='all';store('dz_scope',SCOPE);shelfRender();}
  syncPetals();
  var pk=pickItem();if(!pk)return null;
  daisyDropped=daisyOrder.slice(0,pk.drop);buildDaisy(document.getElementById('headFlower'),false);
  return pk.it;
}
function exGo(dir,fromDx){
  if(exBusy||FL||!document.getElementById('exBody'))return false;
  var it=null;
  if(dir<0){if(HPOS<=0){exBounce(fromDx||0);return false;}HPOS--;it=HIST[HPOS];}
  else if(HPOS<HIST.length-1){HPOS++;it=HIST[HPOS];}
  else{it=exPickNew();if(!it){exBounce(fromDx||0);return false;}HIST.push(it);HPOS=HIST.length-1;}
  exSlide(it,dir,fromDx||0);return true;
}
function exSlide(it,dir,fromDx){
  var body=document.getElementById('exBody'),box=body&&body.closest('.ex-box');if(!body)return;
  if(reduceMotion()||!body.animate){body.style.transform='';body.style.opacity='';swapBody(it,{cls:'slid'});return;}
  exBusy=true;
  var w=(box?box.clientWidth:320)*.55,o0=Math.max(0,1-Math.abs(fromDx)/(w*1.6));
  body.style.transform='';body.style.opacity='';
  var out=body.animate([{transform:'translateX('+fromDx+'px)',opacity:o0},{transform:'translateX('+(-dir*w)+'px)',opacity:0}],{duration:200,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
  out.onfinish=function(){
    swapBody(it,{cls:'slid'});
    var b2=document.getElementById('exBody');if(!b2){exBusy=false;return;}
    b2.animate([{transform:'translateX('+(dir*w)+'px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:380,easing:'cubic-bezier(.15,.8,.25,1)'}).onfinish=function(){exBusy=false;};
  };
}
function exBounce(fromDx){
  var body=document.getElementById('exBody');if(!body)return;
  body.style.transform='';body.style.opacity='';
  if(!body.animate)return;
  var d=fromDx||18;
  body.animate([{transform:'translateX('+d+'px)'},{transform:'translateX('+(-d*.15)+'px)'},{transform:'translateX(0)'}],{duration:420,easing:'ease-out'});
}
function exSwipeBind(box){
  if(!box)return;
  var sx=0,sy=0,t0=0,mode=0,dx=0;   /* mode: 0 = 아직 모름, 1 = 가로로 넘기는 중, -1 = 세로 스크롤 */
  box.addEventListener('touchstart',function(e){
    if(e.touches.length!==1||exBusy||FL){mode=-1;return;}
    var t=e.target;if(t.closest&&t.closest('textarea,input,button.cm-send,.cm.open')){mode=-1;return;}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();mode=0;dx=0;
  },{passive:true});
  box.addEventListener('touchmove',function(e){
    if(mode<0)return;
    var x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(mode===0){if(Math.abs(x)<10&&Math.abs(y)<10)return;mode=Math.abs(x)>Math.abs(y)*1.2?1:-1;if(mode<0)return;}
    e.preventDefault();
    dx=x;var body=document.getElementById('exBody');if(!body)return;
    var edge=(dx>0&&HPOS<=0);                                      /* 앞 문장이 없으면 고무줄처럼 */
    var shown=edge?dx*.28:dx;
    body.style.transform='translateX('+shown+'px)';body.style.opacity=String(Math.max(.25,1-Math.abs(shown)/(box.clientWidth*.9)));
  },{passive:false});
  box.addEventListener('touchend',function(){
    if(mode!==1){mode=0;return;}
    mode=0;var dt=Math.max(1,Date.now()-t0),fast=Math.abs(dx)/dt>.45;
    var body=document.getElementById('exBody');
    if(Math.abs(dx)>70||(fast&&Math.abs(dx)>30)){
      var dir=dx<0?1:-1,shown=(dir<0&&HPOS<=0)?dx*.28:dx;
      if(!exGo(dir,shown)&&body){body.style.transform='';body.style.opacity='';}
    }else if(body){
      var cur=(dx>0&&HPOS<=0)?dx*.28:dx;body.style.transform='';body.style.opacity='';
      if(body.animate)body.animate([{transform:'translateX('+cur+'px)'},{transform:'translateX(0)'}],{duration:260,easing:'cubic-bezier(.2,.8,.3,1)'});
    }
  });
  box.addEventListener('touchcancel',function(){mode=0;var body=document.getElementById('exBody');if(body){body.style.transform='';body.style.opacity='';}});
}
function exNext(){
  if(exBusy||daisyAnimating)return;
  var body=document.getElementById('exBody'),btn=document.getElementById('exNext');
  if(!body||!btn){closeExcerpt();daisyClick();return;}
  if(!scopeItems().length){SCOPE='all';store('dz_scope',SCOPE);shelfRender();}

    .sort(function(a,b){return pn(a.x)-pn(b.x)||a.ei-b.ei;}).map(function(o){return o.ei;});
  flTocMark(i);
  var msg=document.getElementById('flTocMsg');clearTimeout(f.msgT);
  var left=eis.filter(function(ei){return !f.formed[ei];});
  var t=!eis.length?'이 목차에는 문장이 없습니다':!left.length?'이미 모두 모였습니다':'문장 '+left.length+'개를 모읍니다';
  if(msg){msg.textContent=t;f.msgT=setTimeout(function(){msg.textContent='';},2800);}
  if(!left.length){                                                   /* 이미 모였으면 그 문장들로 데려간다 */
    var first=eis.length&&f.col.querySelector('.fl-sent[data-ei="'+eis[0]+'"]');
    if(first){f.col.querySelectorAll('.fl-sent.sel').forEach(function(e){e.classList.remove('sel');});
      eis.forEach(function(ei){var sn=f.col.querySelector('.fl-sent[data-ei="'+ei+'"]');if(sn)sn.classList.add('sel');});
      f.ov.scrollTo({top:Math.max(0,first.offsetTop+f.col.offsetTop-90),behavior:'smooth'});}
    return;
  }
  if(innerWidth<900)setTimeout(function(){flTocOpen(false);},350);   /* 폰: 목차를 닫아 모이는 모습을 보여 준다 */
  flRequest(left);
}
function floatKill(){if(!FL)return;cancelAnimationFrame(FL.raf);if(FL.ov)FL.ov.remove();FL=null;}
function floatClose(){
  if(!FL||FL.closing)return;
  var f=FL;f.closing=true;
  if(f.boxAnim)f.boxAnim.reverse();
  f.ov.animate([{opacity:1},{opacity:0}],{duration:420,easing:'ease',fill:'forwards'}).onfinish=function(){if(FL===f)floatKill();};
}
/* 어절 하나를 누르면: 그 문장의 어절들이 차례로 깨어나 위쪽의 제자리로 날아가 문장이 된다 */
function floatForm(ei){
  var f=FL;if(!f||f.busy||f.closing||f.formed[ei])return;
  f.busy=true;f.formed[ei]=true;flHl(-1);
  var it=f.list[ei],ws=flWords(it.text),pg=flPage(it);
  var sent=document.createElement('div');sent.className='fl-sent';sent.setAttribute('data-ei',ei);sent.title='눌러서 목차에서 찾기';
  sent.innerHTML='<p>'+ws.map(function(w,i){return '<span class="fw pending" data-i="'+i+'">'+esc(w)+'</span>';}).join(' ')+'</p>'
    +(pg?'<div class="fl-src pending">'+esc(pg)+'</div>':'');
  f.col.appendChild(sent);
  var spans=[].slice.call(sent.querySelectorAll('.fw')),sr=f.stage.getBoundingClientRect();
  var fFs=parseFloat(getComputedStyle(spans[0]).fontSize)||16;
  var src={};f.groups[ei].forEach(function(o){src[o.wi]=o;o.frozen=true;o.el.classList.remove('on');});
  floatLayout();                                                        /* 남은 어절 구름은 새 문장 밑으로 */
  var st=sent.offsetTop+f.col.offsetTop;                                  /* 새 문장이 화면에 보이게 */
  if(st+sent.offsetHeight>f.ov.scrollTop+innerHeight-120||st<f.ov.scrollTop+60)f.ov.scrollTo({top:Math.max(0,st-90),behavior:'smooth'});
  var still=reduceMotion(),maxEnd=0,n=spans.length;
  spans.forEach(function(sp,i){
    var r=sp.getBoundingClientRect(),fx=r.left-sr.left+r.width/2,fy=r.top-sr.top+r.height/2;
    var o=src[i],delay=i*(n>40?28:55)+Math.random()*90,dur=still?1:1100+Math.random()*400;
    maxEnd=Math.max(maxEnd,delay+dur);
    if(!o){                                                                /* 구름에 없던 어절은 제자리에서 피어난다 */
      setTimeout(function(){sp.classList.remove('pending');if(!still)sp.animate([{opacity:0,filter:'blur(4px)'},{opacity:1,filter:'blur(0)'}],{duration:900,easing:'ease'});},delay+dur*.6);
      return;
    }
    var el=o.el,sc=o.fs/fFs,mx=(o.x+fx)/2+(Math.random()-.5)*60,my=(o.y+fy)/2+(Math.random()-.5)*40;
    el.style.fontSize=fFs+'px';el.style.padding='0';el.style.transition='none';el.style.lineHeight=getComputedStyle(sp).lineHeight;
    var A=el.animate([
      {transform:'translate('+o.x+'px,'+o.y+'px) translate(-50%,-50%) rotate('+o.rot+'deg) scale('+sc+')',opacity:o.op},
      {transform:'translate('+mx+'px,'+my+'px) translate(-50%,-50%) rotate('+(o.rot*.35)+'deg) scale('+((sc+1)/2)+')',opacity:1,offset:.5},
      {transform:'translate('+fx+'px,'+fy+'px) translate(-50%,-50%) rotate(0deg) scale(1)',opacity:1}
    ],{duration:dur,delay:delay,easing:'cubic-bezier(.35,.55,.2,1)',fill:'both'});
    A.onfinish=function(){sp.classList.remove('pending');el.remove();};
  });
  setTimeout(function(){
    var s2=sent.querySelector('.fl-src');if(s2)s2.classList.remove('pending');
    if(FL!==f)return;
    f.words=f.words.filter(function(o){return !o.frozen;});
    f.busy=false;
    setTimeout(flQueueRun,140);                                          /* 줄 서 있는 다음 문장 */
  },maxEnd+80);
}
function closeExcerpt(){if(FL)floatKill();exBusy=false;CUR=null;if(exTimer){clearInterval(exTimer);exTimer=null;}var e=document.getElementById('exOv');if(e)e.remove();document.removeEventListener('keydown',exEsc);}

document.getElementById('flowerBtn').addEventListener('click',daisyClick);
buildDaisy(document.getElementById('headFlower'),false);shelfRender();
loadExcerpts();
</script>
